services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      ORIGIN: https://pmcpmis.sys4dev.site
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:4000:3000'
    mem_limit: 512m

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    command:
      - --innodb-buffer-pool-size=256M
      - --max-connections=50
      - --performance-schema=OFF
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      retries: 10
    mem_limit: 768m

  adminer:
    image: adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - '127.0.0.1:8080:8080'
    mem_limit: 64m

volumes:
  mysqldata:
